<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>What If Air Had A Surface</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;width:100vw;height:100vh}
canvas{display:block;width:100%;height:100%}
video{position:absolute;opacity:0;pointer-events:none}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  color:#eee;font:500 1.05rem/1.6 system-ui,sans-serif;text-align:center;z-index:10;
  pointer-events:none;transition:opacity .6s}
#msg span{background:rgba(0,0,0,.6);padding:.5em 1.1em;border-radius:.7em;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
</style>
</head>
<body>

<div id="msg"><span>Loading hand tracking…</span></div>
<video id="cam" playsinline autoplay muted></video>
<canvas id="c"></canvas>

<script type="module">
// ═══════════════════════════════════════════════════════════════
//  "What if air had a surface" — V12: 2D Heightmap Gel Sheet
//
//  PASS 1 — HEIGHTMAP (half-res R16F ping-pong FBO):
//    • Black background. For each fingertip, draw a thick
//      blurred Gaussian capsule stroke (prev→cur position).
//    • All strokes are additive white blurs on the same FBO,
//      so they NATURALLY sum into one big merged white blob.
//    • Decay previous frame × 0.985 for lingering trails.
//    • Output: a smooth 2D grayscale heightmap. Bright = gel.
//
//  PASS 2 — RENDER (full-res, screen):
//    • Read the heightmap.
//    • smoothstep threshold → defines ONE unified gel edge.
//    • Below threshold: render normal background, no effect.
//    • Above threshold: use heightmap gradient (neighbor sampling)
//      to offset background UVs (pure refraction, no color add).
//    • AT the thresholded edge only: bright white specular rim.
//    • NO dark rims, NO black borders, NO internal texture.
//    • Interior = perfectly smooth, clear, refracted background.
// ═══════════════════════════════════════════════════════════════

const ui     = document.getElementById("msg");
const video  = document.getElementById("cam");
const canvas = document.getElementById("c");
const gl     = canvas.getContext("webgl2", { antialias: false, alpha: false });
if (!gl) { show("WebGL 2 not supported."); throw 0; }

const extFloat = gl.getExtension("EXT_color_buffer_float");
if (!extFloat) { show("Float render targets not supported."); throw 0; }

function show(t) { ui.querySelector("span").textContent = t; }

// ═════════════════════════════════════════════════════════════
//  SHADERS
// ═════════════════════════════════════════════════════════════

const QUAD_VS = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main(){
  v_uv = a_pos * .5 + .5;
  gl_Position = vec4(a_pos, 0., 1.);
}`;

// ──────── Pass 1: Paint blurred strokes → heightmap ────────
const PAINT_FS = `#version 300 es
precision highp float;
in  vec2 v_uv;
out vec4 O;

uniform sampler2D u_prev;
uniform float     u_decay;
uniform float     u_aspect;
uniform int       u_count;
uniform vec2      u_ptA[10];      // stroke start (prev position, UV)
uniform vec2      u_ptB[10];      // stroke end   (cur position, UV)
uniform float     u_rad[10];     // brush radius per fingertip

void main(){
  // Decay previous frame
  float prev = texture(u_prev, v_uv).r * u_decay;

  // Aspect-correct for circular brushes
  vec2 p = vec2(v_uv.x * u_aspect, v_uv.y);

  // Draw thick blurred capsule strokes — all additive onto same channel.
  // Because they are just white Gaussian blurs, overlapping strokes
  // sum together into one big merged white blob automatically.
  float deposit = 0.0;
  for(int i = 0; i < 10; i++){
    if(i >= u_count) break;

    vec2 a = vec2(u_ptA[i].x * u_aspect, u_ptA[i].y);
    vec2 b = vec2(u_ptB[i].x * u_aspect, u_ptB[i].y);
    float r = u_rad[i];

    // Closest point on segment a→b
    vec2 ba = b - a;
    vec2 pa = p - a;
    float t = clamp(dot(pa, ba) / (dot(ba, ba) + 1e-8), 0.0, 1.0);
    float dist = length(pa - ba * t);

    // Thick Gaussian brush: smooth white circle/capsule
    deposit += exp(-dist * dist / (r * r * 0.5));
  }

  float height = prev + deposit * 0.07;
  height = min(height, 1.0);

  O = vec4(height, 0.0, 0.0, 1.0);
}`;

// ──────── Pass 2: Thick glossy glass — heavy refraction + continuous rim ────────
const RENDER_FS = `#version 300 es
precision highp float;
in  vec2 v_uv;
out vec4 O;

uniform sampler2D u_cam;
uniform sampler2D u_hmap;
uniform float     u_aspect;
uniform vec2      u_texel;      // (1/simW, 1/simH)

void main(){
  // ── Read heightmap ──
  float h = texture(u_hmap, v_uv).r;

  // ── Heightmap gradient (wider stencil for smoother normals) ──
  vec2 tx = vec2(u_texel.x, 0.0);
  vec2 ty = vec2(0.0, u_texel.y);
  float hR = texture(u_hmap, v_uv + tx).r;
  float hL = texture(u_hmap, v_uv - tx).r;
  float hU = texture(u_hmap, v_uv + ty).r;
  float hD = texture(u_hmap, v_uv - ty).r;
  // Second ring for smoother gradient
  float hR2 = texture(u_hmap, v_uv + tx * 2.0).r;
  float hL2 = texture(u_hmap, v_uv - tx * 2.0).r;
  float hU2 = texture(u_hmap, v_uv + ty * 2.0).r;
  float hD2 = texture(u_hmap, v_uv - ty * 2.0).r;
  // Blend inner + outer samples (Sobel-like, smoother)
  vec2 grad = vec2(
    (hR - hL) * 0.667 + (hR2 - hL2) * 0.333,
    (hU - hD) * 0.667 + (hU2 - hD2) * 0.333
  );
  float gradMag = length(grad);

  // Early out if completely outside gel
  if(h < 0.003 && gradMag < 0.00005){
    vec2 camUV = vec2(1.0 - v_uv.x, v_uv.y);
    O = vec4(texture(u_cam, camUV).rgb, 1.0);
    return;
  }

  // ── SHARP THRESHOLD — steep plateau like a water droplet ──
  // Narrow smoothstep = sharp boundary. The gel snaps from 0 to 1
  // over a very thin band, creating a distinct defined edge.
  float gel = smoothstep(0.08, 0.13, h);

  // ── HEAVY REFRACTION — thick glass lens distortion ──
  // Cranked way up so the background visibly warps and magnifies.
  // The gel mask keeps refraction inside the shape only.
  float refStr = 0.45 * gel;
  vec2 displaced = v_uv + grad * refStr;
  vec2 camUV = clamp(vec2(1.0 - displaced.x, displaced.y), 0.0, 1.0);
  vec3 col = texture(u_cam, camUV).rgb;

  // ── Surface normal from gradient ──
  vec3 N = normalize(vec3(
    -grad.x * u_aspect * 14.0,
    -grad.y * 14.0,
    1.0
  ));

  // Light direction (upper-left, toward viewer)
  vec3 L = normalize(vec3(0.5, 0.7, 1.0));
  vec3 V = vec3(0.0, 0.0, 1.0);
  vec3 H = normalize(L + V);

  // ── DARK SHADOW LINE — thin dark edge just outside the bright rim ──
  // This is a narrow band at the very outer edge of the gel threshold.
  // It gives the gel 3D "pop" and separation from the background.
  float outerShadow = smoothstep(0.03, 0.08, h) * (1.0 - smoothstep(0.08, 0.14, h));
  col *= 1.0 - outerShadow * 0.45;

  // ── CONTINUOUS BRIGHT RIM — wraps around the entire inner edge ──
  // A narrow band just inside the gel boundary, based on gradient
  // magnitude (which peaks at the edge where height transitions sharply).
  // This creates a glass-bevel highlight that follows the full outline.

  // The rim band: narrow region right at the boundary
  float rimBand = smoothstep(0.06, 0.12, h) * (1.0 - smoothstep(0.12, 0.25, h));

  // Base rim brightness from gradient steepness (edge = bright, flat = dark)
  float rimBase = smoothstep(0.005, 0.04, gradMag);

  // Directional modulation: one side is brighter, but the rim stays
  // visible all around (never drops below 40% of max brightness)
  float NdotH = max(dot(N, H), 0.0);
  float directional = 0.4 + 0.6 * pow(NdotH, 3.0);

  // Combined rim: continuous white highlight around the full edge
  float rim = rimBand * rimBase * directional * 2.2;

  // Also add a sharp specular glint on top for extra glossiness
  float specGlint = pow(NdotH, 60.0) * rimBase * gel * 0.6;

  col += vec3(1.0) * (rim + specGlint);

  // ── Slight interior magnification tint (very subtle) ──
  // Deep inside the gel, slightly brighten to simulate thick glass
  // concentrating light (caustic-like). Extremely subtle.
  float interior = smoothstep(0.13, 0.35, h);
  col *= 1.0 + interior * 0.06;

  O = vec4(col, 1.0);
}`;

// ═════════════════════════════════════════════════════════════
//  GL HELPERS
// ═════════════════════════════════════════════════════════════

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error("Shader error:\n" + gl.getShaderInfoLog(s));
    show("Shader compile error — check console.");
    throw gl.getShaderInfoLog(s);
  }
  return s;
}

function linkProg(vsSrc, fsSrc){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
  gl.bindAttribLocation(p, 0, "a_pos");
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p));
    throw gl.getProgramInfoLog(p);
  }
  return p;
}

function ulocs(prog, names){
  const o = {};
  for (const n of names) o[n] = gl.getUniformLocation(prog, n);
  return o;
}

// ═════════════════════════════════════════════════════════════
//  PROGRAMS + VAO
// ═════════════════════════════════════════════════════════════

const paintProg  = linkProg(QUAD_VS, PAINT_FS);
const renderProg = linkProg(QUAD_VS, RENDER_FS);

const pU = ulocs(paintProg, [
  "u_prev", "u_decay", "u_aspect",
  "u_count", "u_ptA", "u_ptB", "u_rad",
]);
const rU = ulocs(renderProg, [
  "u_cam", "u_hmap", "u_aspect", "u_texel",
]);

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const vbo = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER,
  new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ═════════════════════════════════════════════════════════════
//  PING-PONG FBOs
// ═════════════════════════════════════════════════════════════

let simW, simH;

function createFBO(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, w, h, 0,
                gl.RED, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
                          gl.TEXTURE_2D, tex, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE){
    show("Framebuffer error."); throw 0;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { fbo, tex };
}

let fboA, fboB;

const camTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, camTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

// ═════════════════════════════════════════════════════════════
//  MEDIAPIPE
// ═════════════════════════════════════════════════════════════

show("Loading hand tracking model…");

let HandLandmarker, FilesetResolver;
try {
  const vision = await import(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  );
  HandLandmarker  = vision.HandLandmarker;
  FilesetResolver = vision.FilesetResolver;
} catch(e){
  show("Failed to load MediaPipe — check your connection.");
  throw e;
}

const fileset = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
);

const detector = await HandLandmarker.createFromOptions(fileset, {
  baseOptions: {
    modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
    delegate: "GPU",
  },
  runningMode: "VIDEO",
  numHands: 2,
});

// ═════════════════════════════════════════════════════════════
//  WEBCAM
// ═════════════════════════════════════════════════════════════

show("Starting camera…");

try {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();
} catch(e){
  show("Camera access denied — please allow camera and reload.");
  throw e;
}

canvas.width  = video.videoWidth;
canvas.height = video.videoHeight;

simW = Math.round(canvas.width  * 0.5);
simH = Math.round(canvas.height * 0.5);
fboA = createFBO(simW, simH);
fboB = createFBO(simW, simH);

ui.style.opacity = "0";
setTimeout(() => ui.remove(), 700);

// ═════════════════════════════════════════════════════════════
//  FINGERTIP TRACKING
// ═════════════════════════════════════════════════════════════

const TIP_IDS  = [4, 8, 12, 16, 20];
const TIP_RADII = [0.045, 0.038, 0.038, 0.035, 0.032];

const ptA       = new Float32Array(20);
const ptB       = new Float32Array(20);
const radBuf    = new Float32Array(10);
const smoothed  = new Float32Array(20);
let hasPrev     = false;
let count       = 0;
let lastDetect  = 0;
let readFBO     = fboA;
let writeFBO    = fboB;

const SMOOTH = 0.3;
const DECAY  = 0.985;

function loop(now){
  requestAnimationFrame(loop);
  if (video.readyState < 2) return;

  const aspect = canvas.width / canvas.height;

  // ── Hand detection ──
  if (now - lastDetect > 33){
    lastDetect = now;
    const res = detector.detectForVideo(video, now);
    const nh  = res.landmarks ? res.landmarks.length : 0;

    let idx = 0;

    for (let h = 0; h < Math.min(nh, 2); h++){
      const hand = res.landmarks[h];
      for (let f = 0; f < 5; f++){
        const lm = hand[TIP_IDS[f]];
        const si = (h * 5 + f) * 2;
        const nx = 1.0 - lm.x;
        const ny = 1.0 - lm.y;

        if (hasPrev){
          // Save previous smoothed position as stroke start
          ptA[idx * 2]     = smoothed[si];
          ptA[idx * 2 + 1] = smoothed[si + 1];
          // Smooth toward new detection
          smoothed[si]     = smoothed[si]     * SMOOTH + nx * (1 - SMOOTH);
          smoothed[si + 1] = smoothed[si + 1] * SMOOTH + ny * (1 - SMOOTH);
        } else {
          smoothed[si]     = nx;
          smoothed[si + 1] = ny;
          ptA[idx * 2]     = nx;
          ptA[idx * 2 + 1] = ny;
        }

        ptB[idx * 2]     = smoothed[si];
        ptB[idx * 2 + 1] = smoothed[si + 1];
        radBuf[idx]      = TIP_RADII[f];
        idx++;
      }
    }

    count = idx;
    if (nh > 0) hasPrev = true;
    if (nh === 0) hasPrev = false;
  }

  // ── Webcam texture ──
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, camTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA,
                gl.UNSIGNED_BYTE, video);

  // ═══════════════════════════════════════════
  //  PASS 1 — Paint blurred strokes → heightmap
  // ═══════════════════════════════════════════
  gl.bindFramebuffer(gl.FRAMEBUFFER, writeFBO.fbo);
  gl.viewport(0, 0, simW, simH);
  gl.useProgram(paintProg);

  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_2D, readFBO.tex);

  gl.uniform1i(pU.u_prev, 3);
  gl.uniform1f(pU.u_decay, DECAY);
  gl.uniform1f(pU.u_aspect, aspect);
  gl.uniform1i(pU.u_count, count);
  gl.uniform2fv(pU.u_ptA, ptA);
  gl.uniform2fv(pU.u_ptB, ptB);
  gl.uniform1fv(pU.u_rad, radBuf);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // ═══════════════════════════════════════════
  //  PASS 2 — Render: threshold + refract + specular rim
  // ═══════════════════════════════════════════
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(renderProg);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, camTex);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, writeFBO.tex);

  gl.uniform1i(rU.u_cam, 0);
  gl.uniform1i(rU.u_hmap, 1);
  gl.uniform1f(rU.u_aspect, aspect);
  gl.uniform2f(rU.u_texel, 1.0 / simW, 1.0 / simH);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // ── Swap ──
  const tmp = readFBO;
  readFBO  = writeFBO;
  writeFBO = tmp;
}

requestAnimationFrame(loop);
</script>
</body>
</html>
